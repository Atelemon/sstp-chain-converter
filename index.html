<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSTP 转换和集合</title>
<style>body{font:16px/1.7 system-ui,sans-serif;max-width:900px;margin:24px auto;padding:20px;color:#202735}textarea,input,select{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 14px;border:1px solid #ccd5e3;border-radius:8px;font:14px Consolas,monospace}textarea{height:220px}button{padding:10px 16px;margin:5px 8px 5px 0;border:0;border-radius:8px;background:#285ce5;color:white;cursor:pointer}.note{font-size:13px;color:#657187}#status{white-space:pre-wrap;background:#eef3fb;padding:10px}</style></head>
<body><h1>SSTP 转换和 TXT 集合</h1><p>转换在浏览器内完成，不加编号或长备注。</p><label>入口域名</label><input id="entry" value="021063.xyz" spellcheck="false"><label>无法识别地区时</label><select id="fallback"><option value="">跳过并提示</option><option>US</option><option>JP</option><option>KR</option><option>RU</option><option>TW</option><option>HK</option><option>SG</option><option>GB</option><option>DE</option><option>CA</option><option>AU</option></select><label>原始 SSTP 节点，每行一条</label><textarea id="src" spellcheck="false"></textarea><button id="convert">转换</button><label>转换结果</label><textarea id="out" readonly spellcheck="false"></textarea><button id="copy">复制结果</button><button id="publish">提交更新集合</button><p class="note">提交更新会打开 GitHub Issue 页面，使用 Atelemon 登录并点击创建 Issue 后，Actions 才会覆盖 nodes.txt。节点凭据将公开并保留历史。无需在本网页填写 GitHub Token。</p><p><a href="https://raw.githubusercontent.com/Atelemon/sstp-chain-converter/main/nodes.txt" target="_blank" rel="noopener noreferrer">查看固定 TXT 集合</a> · <a href="https://github.com/Atelemon/sstp-chain-converter/actions" target="_blank" rel="noopener noreferrer">查看更新任务</a></p><div id="status">等待输入。</div><script>
'use strict';
const $=id=>document.getElementById(id);
const countries={US:['United States','美国','美國','🇺🇸'],JP:['Japan','日本','🇯🇵'],KR:['South Korea','韩国','韓國','🇰🇷'],RU:['Russia','俄罗斯','俄羅斯','🇷🇺'],TW:['Taiwan','台湾','台灣','臺灣','🇹🇼'],HK:['Hong Kong','香港','🇭🇰'],SG:['Singapore','新加坡','狮城','獅城','🇸🇬'],GB:['United Kingdom','Britain','英国','英國','🇬🇧'],DE:['Germany','德国','德國','🇩🇪'],CA:['Canada','加拿大','🇨🇦'],AU:['Australia','澳大利亚','澳大利亞','澳洲','🇦🇺']};
function regionOf(note){const matches=Object.entries(countries).filter(([code,words])=>words.some(w=>note.toLowerCase().includes(w.toLowerCase()))||new RegExp('(^|[^A-Za-z])'+code+'(?=$|[^A-Za-z])','i').test(note));return matches.length===1?matches[0][0]:''}
function validEndpoint(s){try{const u=new URL(s);return s.startsWith('sstp://')&&!/[\s$#]/.test(s)&&!!u.hostname&&!!u.username&&!!u.port&&Number(u.port)>0&&Number(u.port)<=65535&&!u.search&&(!u.pathname||u.pathname==='/')}catch(_){return false}}
$('convert').onclick=()=>{const entry=$('entry').value.trim();if(!/^[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?(?::[0-9]{1,5})?$/.test(entry)){$('status').textContent='入口格式错误，请填写域名或域名:端口。';return}const out=[],errors=[];$('src').value.split(/\r?\n/).forEach((raw,i)=>{const s=raw.trim();if(!s)return;const n=s.indexOf('#'),ep=n<0?s:s.slice(0,n);let note=n<0?'':s.slice(n+1);try{note=decodeURIComponent(note)}catch(_){}const region=regionOf(note)||$('fallback').value;if(!validEndpoint(ep)){errors.push('第 '+(i+1)+' 行连接格式错误。');return}if(!region){errors.push('第 '+(i+1)+' 行地区未知或有歧义。');return}out.push(entry+'#'+region+' 链式SSTP代理$'+ep)});$('out').value=out.join('\n');$('status').textContent='成功 '+out.length+' 条，跳过 '+errors.length+' 条。\n'+errors.join('\n')};
async function copyResult(){try{await navigator.clipboard.writeText($('out').value);return true}catch(_){$('out').focus();$('out').select();return false}}
$('copy').onclick=async()=>{$('status').textContent=(await copyResult())?'已复制。':'结果已选中，请按 Ctrl+C 或 Command+C。'};
$('publish').onclick=()=>{const text=$('out').value.trim();if(!text){$('status').textContent='请先转换节点。';return}if(new TextEncoder().encode(text).length>200000){$('status').textContent='结果超过 200 KB，请减少节点。';return}if(!confirm('节点凭据会公开到 GitHub，并覆盖现有 nodes.txt。继续打开提交页面吗？'))return;const base='https://github.com/Atelemon/sstp-chain-converter/issues/new?title='+encodeURIComponent('更新节点集合');const body='```text\n'+text+'\n```';const full=base+'&body='+encodeURIComponent(body);if(full.length>6500){copyResult();window.open(base,'_blank','noopener,noreferrer');$('status').textContent='内容较长，请复制结果到 Issue 正文中，外面用 ```text 和 ``` 包围，然后点击创建 Issue。'}else{window.open(full,'_blank','noopener,noreferrer');$('status').textContent='请在 GitHub 页面核对正文并点击创建 Issue。提交后到 Actions 查看结果。'}};
</script></body></html>
