name: Refresh VPNGate SSTP nodes
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: node-collection-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch and merge validated subscription
        env:
          VPNGATE_TOKEN: ${{ secrets.VPNGATE_TOKEN }}
          VPNGATE_TIME_TOKENS: 'true'
          SSTP_ENTRY: '021063.xyz'
        run: python3 update_vpngate.py
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nodes-auto.txt nodes.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh VPNGate subscription'
            git push origin HEAD:main
          fi
