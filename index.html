<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSTP 链式节点转换器</title><style>body{font:16px system-ui,"Microsoft YaHei",sans-serif;max-width:900px;margin:30px auto;padding:20px;color:#202735}textarea,input,select{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 14px;border:1px solid #ccd5e3;border-radius:8px;font:14px Consolas,monospace}textarea{height:220px}button{padding:10px 16px;margin:5px 8px 5px 0;border:0;border-radius:8px;background:#285ce5;color:white;cursor:pointer}.note{font-size:13px;color:#657187}#status{white-space:pre-wrap;background:#eef3fb;padding:10px;border-radius:8px}</style></head><body><h1>SSTP 链式节点转换器</h1><p>浏览器内转换，不上传原始节点。输出格式：入口域名#地区 链式SSTP代理$原始SSTP连接。</p><label>入口域名</label><input id="entry" value="021063.xyz"><label>无法识别地区时</label><select id="fallback"><option value="">跳过并提示</option><option>US</option><option>JP</option><option>KR</option><option>RU</option><option>TW</option><option>HK</option><option>SG</option><option>GB</option><option>DE</option><option>CA</option><option>AU</option></select><label>原始 SSTP 节点，每行一条</label><textarea id="src" placeholder="sstp://vpn:vpn@server:port#Japan Osaka"></textarea><button id="convert">转换</button><button id="copy">复制结果</button><label>转换结果</label><textarea id="out" readonly></textarea><div id="status">等待输入。</div><p class="note">本页面只负责转换文本，不检测连通性，也不会自动写入 GitHub。</p><script>const $=x=>document.getElementById(x);const rs=[['US',/美国|美國|🇺🇸|United\s+States|(?:^|[^A-Za-z])(?:US|USA)(?=$|[^A-Za-z])/i],['JP',/日本|🇯🇵|Japan|(?:^|[^A-Za-z])(?:JP|JPN)(?=$|[^A-Za-z])/i],['KR',/韩国|韓國|🇰🇷|South\s+Korea|(?:^|[^A-Za-z])(?:KR|KOR)(?=$|[^A-Za-z])/i],['RU',/俄罗斯|俄羅斯|🇷🇺|Russia|(?:^|[^A-Za-z])(?:RU|RUS)(?=$|[^A-Za-z])/i],['TW',/台湾|台灣|臺灣|🇹🇼|Taiwan|(?:^|[^A-Za-z])(?:TW|TWN)(?=$|[^A-Za-z])/i],['HK',/香港|🇭🇰|Hong\s+Kong|(?:^|[^A-Za-z])(?:HK|HKG)(?=$|[^A-Za-z])/i],['SG',/新加坡|狮城|獅城|🇸🇬|Singapore|(?:^|[^A-Za-z])(?:SG|SGP)(?=$|[^A-Za-z])/i],['GB',/英国|英國|🇬🇧|United\s+Kingdom|Britain|(?:^|[^A-Za-z])(?:GB|GBR|UK)(?=$|[^A-Za-z])/i],['DE',/德国|德國|🇩🇪|Germany|(?:^|[^A-Za-z])(?:DE|DEU)(?=$|[^A-Za-z])/i],['CA',/加拿大|🇨🇦|Canada|(?:^|[^A-Za-z])(?:CA|CAN)(?=$|[^A-Za-z])/i],['AU',/澳大利亚|澳大利亞|澳洲|🇦🇺|Australia|(?:^|[^A-Za-z])(?:AU|AUS)(?=$|[^A-Za-z])/i]];function conv(){const e=$("entry").value.trim(),out=[],err=[];$('src').value.split(/\r?\n/).forEach((raw,i)=>{const s=raw.trim();if(!s)return;const p=s.indexOf('#'),ep=p<0?s:s.slice(0,p),note=p<0?'':s.slice(p+1),m=rs.filter(x=>x[1].test(note));const r=m.length===1?m[0][0]:$("fallback").value;if(!ep.startsWith('sstp://'))err.push(`第${i+1}行不是sstp链接`);else if(!r)err.push(`第${i+1}行地区无法识别`);else out.push(`${e}#${r} 链式SSTP代理$${ep}`)});$("out").value=out.join('\n');$("status").textContent=`成功 ${out.length} 条，跳过 ${err.length} 条。`+(err.length?'\n'+err.join('\n'):'')}$("convert").onclick=conv;$("copy").onclick=async()=>{await navigator.clipboard.writeText($("out").value);$("status").textContent+='\n已复制。'}</script></body></html>
